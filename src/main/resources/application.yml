spring:
  application:
    name: centinela

# Configuracion base. Los valores por ambiente (staging/production) y los nombres
# de contenedores/colas se inyectan como app settings del App Service (ISS-004),
# nunca como secretos versionados.

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

centinela:
  storage:
    blob:
      account-name: ${CENTINELA_STORAGE_ACCOUNT}
      container-name: ${CENTINELA_RAW_TRANSACTIONS_CONTAINER}
    documents:
      account-name: ${CENTINELA_STORAGE_ACCOUNT}
      container-name: ${CENTINELA_VERIFICATION_DOCUMENTS_CONTAINER}
  security:
    entra:
      # Issuer, audience y JWK set URI de la app registration en Entra ID.
      # Ninguno de estos valores es secreto; se inyectan como app settings
      # del App Service (ISS-004), nunca versionados con valores reales.
      issuer-uri: ${CENTINELA_ENTRA_ISSUER_URI}
      audience: ${CENTINELA_ENTRA_AUDIENCE}
      jwk-set-uri: ${CENTINELA_ENTRA_JWK_SET_URI}
  # ISS-S2-003 — El unico secreto real de Semana 2 (connection string de Cosmos for
  # MongoDB) vive en Key Vault y se inyecta como app setting por referencia
  # @Microsoft.KeyVault(...) resuelta por Managed Identity: aqui SOLO hay una
  # referencia al env var, nunca el valor. Default vacio para no acoplar el arranque
  # (su consumidor real es la Function de scoring, ISS-S2-007).
  cosmos:
    connection-string: ${CENTINELA_COSMOS_CONNECTION_STRING:}
  # ISS-S2-006 — Endpoint del Event Grid Topic donde la API publica
  # transaction-event-v1 tras persistir. No es secreto (la autenticacion es por
  # Managed Identity); se inyecta como app setting del App Service, nunca versionado.
  messaging:
    eventgrid:
      topic-endpoint: ${CENTINELA_EVENTGRID_TOPIC_ENDPOINT:}
  # ISS-S2-006 — Limitacion de tasa por origen (token bucket en la app). Ajustable
  # sin recompilar via app settings: 'capacity' tokens que se rellenan por completo
  # cada 'refill-period-ms' milisegundos. Al agotarse, la API responde 429.
  ratelimit:
    capacity: ${CENTINELA_RATELIMIT_CAPACITY:120}
    refill-period-ms: ${CENTINELA_RATELIMIT_REFILL_MS:60000}
