spring:
  application:
    name: centinela

# Configuracion base. Los valores por ambiente (staging/production) y los nombres
# de contenedores/colas se inyectan como app settings del App Service (ISS-004),
# nunca como secretos versionados.

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

centinela:
  storage:
    blob:
      account-name: ${CENTINELA_STORAGE_ACCOUNT}
      container-name: ${CENTINELA_RAW_TRANSACTIONS_CONTAINER}
    documents:
      account-name: ${CENTINELA_STORAGE_ACCOUNT}
      container-name: ${CENTINELA_VERIFICATION_DOCUMENTS_CONTAINER}
  queue:
    adapter: azure-storage-queue
    flagged-cases:
      name: ${CENTINELA_FLAGGED_CASES_QUEUE:flagged-cases}
      visibility-timeout: PT30S
      poll-interval: PT5S
    consumer:
      auto-start: ${CENTINELA_QUEUE_AUTO_START:true}
  security:
    entra:
      # Issuer, audience y JWK set URI de la app registration en Entra ID.
      # Ninguno de estos valores es secreto; se inyectan como app settings
      # del App Service (ISS-004), nunca versionados con valores reales.
      issuer-uri: ${CENTINELA_ENTRA_ISSUER_URI}
      audience: ${CENTINELA_ENTRA_AUDIENCE}
      jwk-set-uri: ${CENTINELA_ENTRA_JWK_SET_URI}
