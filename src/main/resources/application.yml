spring:
  application:
    name: centinela

  # FEAT-S2-001: Configuracion de PostgreSQL para gestion de casos.
  # La conexion NO usa password; usa Managed Identity via env vars inyectadas.
  datasource:
    url: ${CENTINELA_POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/centinela}
    username: ${CENTINELA_POSTGRES_USER:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true

centinela:
  storage:
    blob:
      account-name: ${CENTINELA_STORAGE_ACCOUNT}
      container-name: ${CENTINELA_RAW_TRANSACTIONS_CONTAINER}
    documents:
      account-name: ${CENTINELA_STORAGE_ACCOUNT}
      container-name: ${CENTINELA_VERIFICATION_DOCUMENTS_CONTAINER}
  queue:
    adapter: azure-storage-queue
    flagged-cases:
      name: ${CENTINELA_FLAGGED_CASES_QUEUE:flagged-cases}
      visibility-timeout: PT30S
      poll-interval: PT5S
    consumer:
      auto-start: ${CENTINELA_QUEUE_AUTO_START:true}
  security:
    entra:
      issuer-uri: ${CENTINELA_ENTRA_ISSUER_URI}
      audience: ${CENTINELA_ENTRA_AUDIENCE}
      jwk-set-uri: ${CENTINELA_ENTRA_JWK_SET_URI}
  cosmos:
    connection-string: ${CENTINELA_COSMOS_CONNECTION_STRING:}
  messaging:
    eventgrid:
      topic-endpoint: ${CENTINELA_EVENTGRID_TOPIC_ENDPOINT:}
  ratelimit:
    capacity: ${CENTINELA_RATELIMIT_CAPACITY:120}
    refill-period-ms: ${CENTINELA_RATELIMIT_REFILL_MS:60000}
