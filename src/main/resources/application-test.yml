# Perfil de prueba: arranca la aplicacion SIN conectarse a Azure.
# No define credenciales, connection strings ni endpoints de Storage.
spring:
  application:
    name: centinela-test

management:
  endpoints:
    web:
      exposure:
        include: health

centinela:
  storage:
    blob:
      account-name: centinelatest
      container-name: raw-transactions-staging
    documents:
      account-name: centinelatest
      container-name: verification-documents-staging
  security:
    entra:
      # Valores ficticios: el JwtDecoder solo resuelve el JWK set de forma
      # perezosa (al decodificar un token real), y las pruebas de este
      # perfil mockean JwtDecoder o desactivan los filtros de seguridad.
      # Por eso no se realiza ninguna llamada de red al arrancar el contexto.
      issuer-uri: https://login.microsoftonline.com/test-tenant/v2.0
      audience: api://centinela-test
      jwk-set-uri: https://login.microsoftonline.com/test-tenant/discovery/v2.0/keys
