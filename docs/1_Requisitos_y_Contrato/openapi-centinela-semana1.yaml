openapi: 3.0.3

info:
  title: Centinela API - Semana 1
  version: 1.0.0
  description: API limitada a ingesta y carga técnica de documentos. No incluye scoring ni casos.
  license:
    name: Proprietary

servers:
  - url: https://{host}
    variables:
      host:
        default: centinela.example.com

paths:
  /api/v1/transactions:
    post:
      summary: Recibir y almacenar una transacción cruda
      operationId: ingestTransaction
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
      responses:
        '202':
          description: Transacción recibida y almacenada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionReceipt'
        '400':
          description: Payload inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado
        '403':
          description: Rol no autorizado
        '503':
          description: Storage no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/verification-documents:
    post:
      summary: Cargar un documento de verificación
      operationId: uploadVerificationDocument
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Documento almacenado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentReceipt'
        '400':
          description: Archivo ausente o inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: No autenticado
        '403':
          description: Rol no autorizado
        '503':
          description: Storage no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TransactionRequest:
      type: object
      additionalProperties: false
      required:
        - transactionId
        - accountId
        - amount
        - currency
        - occurredAt
        - location
        - merchant
      properties:
        transactionId:
          type: string
          minLength: 1
        accountId:
          type: string
          minLength: 1
        amount:
          type: number
          format: double
          minimum: 0
          exclusiveMinimum: true
        currency:
          type: string
          minLength: 3
          maxLength: 3
        occurredAt:
          type: string
          format: date-time
        location:
          $ref: '#/components/schemas/Location'
        merchant:
          $ref: '#/components/schemas/Merchant'

    Location:
      type: object
      additionalProperties: false
      required: [countryCode, city]
      properties:
        countryCode:
          type: string
          minLength: 2
          maxLength: 2
        city:
          type: string
          minLength: 1
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180

    Merchant:
      type: object
      additionalProperties: false
      required: [name, category]
      properties:
        name:
          type: string
          minLength: 1
        category:
          type: string
          minLength: 1

    TransactionReceipt:
      type: object
      additionalProperties: false
      required: [transactionId, status]
      properties:
        transactionId:
          type: string
        status:
          type: string
          enum: [RECEIVED]

    DocumentReceipt:
      type: object
      additionalProperties: false
      required: [documentId, status]
      properties:
        documentId:
          type: string
          minLength: 1
        status:
          type: string
          enum: [STORED]

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string