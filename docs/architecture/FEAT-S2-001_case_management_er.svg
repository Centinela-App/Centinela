<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650">
  <defs>
    <style>
      .entity { fill: #E3F2FD; stroke: #1565C0; stroke-width: 2; }
      .pk { fill: #1565C0; }
      .fk { fill: #7B1FA2; }
      .attr { fill: #FAFAFA; stroke: #9E9E9E; stroke-width: 1; }
      .rel { fill: #FFF3E0; stroke: #E65100; stroke-width: 1.5; }
      .label { font-family: 'Segoe UI', sans-serif; font-size: 12px; }
      .title { font-family: 'Segoe UI', sans-serif; font-size: 16px; font-weight: bold; }
      .card { font-size: 10px; }
    </style>
  </defs>

  <!-- Titulo -->
  <text x="450" y="30" text-anchor="middle" class="title">FEAT-S2-001: Modelo de Datos - Gestión de Casos de Fraude</text>

  <!-- case_state -->
  <g transform="translate(50, 80)">
    <rect width="200" height="150" rx="5" class="entity"/>
    <rect y="0" width="200" height="28" rx="5" fill="#1565C0"/>
    <text x="100" y="19" text-anchor="middle" fill="white" font-weight="bold" class="label">case_state</text>
    
    <rect x="10" y="38" width="180" height="24" rx="3" class="attr"/>
    <text x="20" y="54" class="card"><tspan class="pk">PK</tspan> code VARCHAR(32)</text>
    
    <rect x="10" y="68" width="180" height="24" rx="3" class="attr"/>
    <text x="20" y="84" class="card">name VARCHAR(128) NOT NULL</text>
    
    <rect x="10" y="98" width="180" height="24" rx="3" class="attr"/>
    <text x="20" y="114" class="card">description TEXT</text>
    
    <rect x="10" y="128" width="180" height="18" rx="3" class="attr"/>
    <text x="20" y="141" class="card">created_at TIMESTAMPTZ</text>
  </g>

  <!-- fraud_case -->
  <g transform="translate(320, 80)">
    <rect width="200" height="180" rx="5" class="entity"/>
    <rect y="0" width="200" height="28" rx="5" fill="#1565C0"/>
    <text x="100" y="19" text-anchor="middle" fill="white" font-weight="bold" class="label">fraud_case</text>
    
    <rect x="10" y="38" width="180" height="24" rx="3" class="attr"/>
    <text x="20" y="54" class="card"><tspan class="pk">PK</tspan> id BIGSERIAL</text>
    
    <rect x="10" y="68" width="180" height="24" rx="3" class="attr"/>
    <text x="20" y="84" class="card">transaction_id VARCHAR(128) <tspan class="pk">UK</tspan></text>
    
    <rect x="10" y="98" width="180" height="24" rx="3" class="attr"/>
    <text x="20" y="114" class="card">score DECIMAL(5,2)</text>
    
    <rect x="10" y="128" width="180" height="24" rx="3" class="attr"/>
    <text x="20" y="144" class="card"><tspan class="fk">FK</tspan> state_code VARCHAR(32)</text>
    
    <rect x="10" y="158" width="180" height="18" rx="3" class="attr"/>
    <text x="20" y="171" class="card">opened_at, updated_at TIMESTAMPTZ</text>
  </g>

  <!-- case_assignment -->
  <g transform="translate(50, 320)">
    <rect width="200" height="160" rx="5" class="entity"/>
    <rect y="0" width="200" height="28" rx="5" fill="#1565C0"/>
    <text x="100" y="19" text-anchor="middle" fill="white" font-weight="bold" class="label">case_assignment</text>
    
    <rect x="10" y="38" width="180" height="24" rx="3" class="attr"/>
    <text x="20" y="54" class="card"><tspan class="pk">PK</tspan> id BIGSERIAL</text>
    
    <rect x="10" y="68" width="180" height="24" rx="3" class="attr"/>
    <text x="20" y="84" class="card"><tspan class="fk">FK</tspan> case_id BIGINT</text>
    
    <rect x="10" y="98" width="180" height="24" rx="3" class="attr"/>
    <text x="20" y="114" class="card">analyst_id VARCHAR(128)</text>
    
    <rect x="10" y="128" width="180" height="24" rx="3" class="attr"/>
    <text x="20" y="144" class="card">analyst_email, assigned_at, unassigned_at</text>
  </g>

  <!-- case_resolution -->
  <g transform="translate(320, 320)">
    <rect width="200" height="150" rx="5" class="entity"/>
    <rect y="0" width="200" height="28" rx="5" fill="#1565C0"/>
    <text x="100" y="19" text-anchor="middle" fill="white" font-weight="bold" class="label">case_resolution</text>
    
    <rect x="10" y="38" width="180" height="24" rx="3" class="attr"/>
    <text x="20" y="54" class="card"><tspan class="pk">PK</tspan> id BIGSERIAL</text>
    
    <rect x="10" y="68" width="180" height="24" rx="3" class="attr"/>
    <text x="20" y="84" class="card"><tspan class="fk">FK</tspan> case_id BIGINT <tspan class="pk">UK</tspan></text>
    
    <rect x="10" y="98" width="180" height="24" rx="3" class="attr"/>
    <text x="20" y="114" class="card">decision VARCHAR(32)</text>
    
    <rect x="10" y="128" width="180" height="18" rx="3" class="attr"/>
    <text x="20" y="141" class="card">analyst_id, resolved_at, observations</text>
  </g>

  <!-- case_audit (append-only) -->
  <g transform="translate(590, 80)">
    <rect width="260" height="180" rx="5" class="rel"/>
    <rect y="0" width="260" height="28" rx="5" fill="#E65100"/>
    <text x="130" y="19" text-anchor="middle" fill="white" font-weight="bold" class="label">case_audit [APPEND-ONLY]</text>
    
    <rect x="10" y="38" width="240" height="24" rx="3" class="attr"/>
    <text x="20" y="54" class="card"><tspan class="pk">PK</tspan> id BIGSERIAL</text>
    
    <rect x="10" y="68" width="240" height="24" rx="3" class="attr"/>
    <text x="20" y="84" class="card"><tspan class="fk">FK</tspan> case_id BIGINT</text>
    
    <rect x="10" y="98" width="240" height="24" rx="3" class="attr"/>
    <text x="20" y="114" class="card">field_name, old_value, new_value</text>
    
    <rect x="10" y="128" width="240" height="24" rx="3" class="attr"/>
    <text x="20" y="144" class="card">changed_by, changed_at, change_type</text>
    
    <rect x="10" y="158" width="240" height="18" rx="3" class="attr"/>
    <text x="20" y="171" class="card" font-style="italic">No UPDATE/DELETE (Reglas DB)</text>
  </g>

  <!-- Flechas de relaciones -->
  <!-- fraud_case -> case_state -->
  <line x1="250" y1="170" x2="250" y2="130" stroke="#1565C0" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="250" y1="140" x2="270" y2="130" stroke="#1565C0" stroke-width="2"/>
  <text x="255" y="135" font-size="10">1:N</text>

  <!-- fraud_case -> case_assignment -->
  <line x1="370" y1="260" x2="370" y2="320" stroke="#1565C0" stroke-width="2"/>
  <line x1="370" y1="300" x2="250" y2="310" stroke="#1565C0" stroke-width="2"/>
  <text x="310" y="300" font-size="10">1:N</text>

  <!-- fraud_case -> case_resolution -->
  <line x1="470" y1="260" x2="470" y2="320" stroke="#1565C0" stroke-width="2"/>
  <line x1="470" y1="300" x2="520" y2="320" stroke="#1565C0" stroke-width="2"/>
  <text x="500" y="300" font-size="10">1:1</text>

  <!-- fraud_case -> case_audit -->
  <line x1="520" y1="170" x2="590" y2="170" stroke="#E65100" stroke-width="2"/>
  <text x="550" y="165" font-size="10">1:N</text>

  <!-- Leyenda -->
  <g transform="translate(590, 320)">
    <rect width="260" height="120" rx="5" fill="#FAFAFA" stroke="#BDBDBD"/>
    <text x="130" y="20" text-anchor="middle" font-weight="bold" class="label">Leyenda</text>
    
    <rect x="10" y="35" width="20" height="14" class="entity"/>
    <text x="40" y="46" class="card">Entidad</text>
    
    <rect x="10" y="55" width="20" height="14" class="rel"/>
    <text x="40" y="66" class="card">Entidad inmutable</text>
    
    <rect x="10" y="75" width="20" height="14" class="attr"/>
    <text x="40" y="86" class="card">Atributo</text>
    
    <text x="10" y="108" class="card"><tspan class="pk">PK</tspan> = Primary Key</text>
    <text x="10" y="118" class="card"><tspan class="fk">FK</tspan> = Foreign Key</text>
    <text x="120" y="108" class="card"><tspan class="pk">UK</tspan> = Unique</text>
  </g>

  <!-- Notas -->
  <g transform="translate(590, 460)">
    <rect width="260" height="100" rx="5" fill="#FFF8E1" stroke="#FFC107"/>
    <text x="130" y="20" text-anchor="middle" font-weight="bold" class="label">Restricciones</text>
    <text x="10" y="42" class="card">• transaction_id UNIQUE por caso</text>
    <text x="10" y="58" class="card">• case_audit: reglas DB</text>
    <text x="10" y="70" class="card">  rechazan UPDATE/DELETE</text>
    <text x="10" y="86" class="card">• CASCADE en FK de</text>
    <text x="10" y="96" class="card">  case_assignment/resolution</text>
  </g>

  <!-- Flecha definicion -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1565C0"/>
    </marker>
  </defs>
</svg>
